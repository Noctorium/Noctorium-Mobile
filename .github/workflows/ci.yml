name: CI

# Every push and every pull request: the phone compiles into a debug APK against the core this commit
# pins, and the core's own tests pass. The signed release APK is built by Noctorium-Installer, which
# holds the signing key.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The core is checked out by hand rather than as a submodule. A submodule fetch reaches for the
      # same credential as the repository holding it -- here, a job token that can see this repository
      # and nothing else -- so it cannot reach a private Noctorium-Base. NOCTORIUM_BASE_KEY is a
      # read-only deploy key on that repository, and it is read at exactly the commit the submodule
      # pins, so CI builds what a checkout of this commit would build.
      - name: Which core this commit is built against
        id: core
        run: echo "sha=$(git rev-parse HEAD:base)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: Noctorium/Noctorium-Base
          ref: ${{ steps.core.outputs.sha }}
          path: base
          ssh-key: ${{ secrets.NOCTORIUM_BASE_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Android SDK is already on this runner and AGP finds it through ANDROID_HOME.
      - name: Test the core and build the debug APK
        run: ./gradlew :core:test assembleDebug --stacktrace

      - name: Keep the debug APK from this commit
        uses: actions/upload-artifact@v4
        with:
          name: noctorium-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
